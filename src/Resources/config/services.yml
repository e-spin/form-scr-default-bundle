services:
  Espin\FormScrDefaultBundle\EventListener\FormInsertTagsListener:
    public: true
    arguments:
      - '@request_stack'
    tags:
      - name: contao.hook
        hook: replaceInsertTags

  Espin\FormScrDefaultBundle\EventListener\PrepareFormDataListener:
    public: true
    arguments:
      - '@request_stack'
    tags:
      - name: contao.hook
        hook: prepareFormData
        priority: -255
